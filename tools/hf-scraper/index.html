<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>HF Scraper v7 Simple</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0e1116;color:#e5e7eb}.card{background:#161a23;border:1px solid #222}</style>
</head>
<body class="p-5 max-w- mx-auto">
<h1 class="text-2xl font-black">HF Scraper v7 - Simple Flow</h1>
<p class="text-xs opacity-60 mt-1">Paste -> List -> Go to Space -> Check Use via API/MCP -> Save -> Next. As you described.</p>

<div class="card rounded-xl p-4 mt-4 flex gap-2">
<input id="listUrl" class="flex-1 bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-sm" value="https://huggingface.co/spaces?q=Wan2.1&category=video-generation">
<input id="proxy" class="w- bg-black/50 border border-white/10 rounded-xl px-3 py-3 text-xs" value="https://all-tools-factory.sarkarsajib698.workers.dev">
<button onclick="start()" class="bg-white text-black font-bold px-6 rounded-xl">Start</button>
<button onclick="stop()" class="card px-4 rounded-xl">Stop</button>
</div>

<pre id="log" class="card rounded-xl p-3 mt-3 text- h- overflow-auto">Ready. Paste list URL and Start.
Flow: 1. Go to list URL 2. Go to each Space URL 3. Find name + Use via API check 4. Save</pre>

<div class="card rounded-xl mt-3 overflow-auto">
<table class="w-full text-sm"><thead class="text-xs opacity-50 border-b border-white/10"><tr><th class="p-2 text-left">#</th><th class="text-left">Name</th><th>Space URL</th><th>Type</th><th>Has API?</th><th>MCP Tools</th><th>MCP URL</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<button onclick="download()" class="mt-3 bg-[#a78bfa] text-black font-bold px-5 py-2 rounded-xl">Download CSV</button>

<script>
let stopFlag=false;
let data=[];
const $log=document.getElementById('log');
function log(t){ $log.textContent+=`\n${new Date().toLocaleTimeString()} - ${t}`; $log.scrollTop=$log.scrollHeight; }

function getProxy(url){ const p=document.getElementById('proxy').value.replace(/\/$/,''); return `${p}/?url=${encodeURIComponent(url)}`; }

async function start(){
  stopFlag=false; data=[]; document.getElementById('tbody').innerHTML=''; $log.textContent='Starting...\n';
  const listUrl=document.getElementById('listUrl').value.trim();
  // Parse q and category from your link
  let q='', cat='';
  try{ const u=new URL(listUrl); q=u.searchParams.get('q')||''; cat=u.searchParams.get('category')||''; }catch{}
  log(`Step 1: Go to list link: ${listUrl}`);
  log(`Parsed: q=${q}, category=${cat} -> this is Type`);

  // Because HF list page is React (HTML has no cards), we use official API which is same data - no robot block
  // This is same as going to that list page manually
  let api=`https://huggingface.co/api/spaces?search=${encodeURIComponent(q)}&limit=25&sort=likes&direction=-1`;
  if(cat) api+=`&filter=${encodeURIComponent(cat)}`;
  log(`Fetching list via API (same as your screenshot cards): ${api}`);

  let list;
  try{ const r=await fetch(getProxy(api)); list=await r.json(); log(`Found ${list.length} spaces in ${cat}`); }
  catch(e){ log('List fetch failed: '+e.message); return; }

  for(let i=0;i<list.length;i++){
    if(stopFlag) break;
    const sp=list[i];
    const spaceUrl=`https://huggingface.co/spaces/${sp.id}`;
    log(`\n--- [${i+1}/${list.length}] Go to Space URL: ${spaceUrl} ---`);

    // Step 2: Go to that specific model page and find name
    let name = sp.id.split('/').pop().replace(/-/g,' ');
    try{
      const htmlRes=await fetch(getProxy(spaceUrl));
      const html=await htmlRes.text();
      // Try to find <title> or meta
      const m=html.match(/<title>(.*?)<\/title>/);
      if(m) name=m[1].replace('· Hugging Face','').trim();
    }catch{}
    log(`Find name: ${name}`);

    // Step 3: Check Use via API / MCP - try gradio_api
    const gradioBase=`https://${sp.id.replace('/','-').toLowerCase()}.hf.space`.replace('--','-'); // fallback
    const base2=`https://${sp.id.split('/').pop()}.hf.space`;
    // Correct hf.space domain is owner-name -> owner-name
    const hfDomain=`https://${sp.id.replace('/','-').toLowerCase()}.hf.space`;

    let hasApi='No'; let mcpTools=''; let mcpUrl='';
    let mcpJson=null;
    const tryUrls=[
      `${hfDomain}/gradio_api/mcp/`,
      `https://${sp.id.split('/')[0].toLowerCase()}-${sp.id.split('/')[1].toLowerCase()}.hf.space/gradio_api/info?mcp=true`,
      `https://${sp.id.split('/')[0].toLowerCase()}-${sp.id.split('/')[1].toLowerCase()}.hf.space/gradio_api/info`
    ];

    for(let u of tryUrls){
      if(stopFlag) break;
      try{
        log(`Checking Use via API: ${u}`);
        const r=await fetch(getProxy(u));
        const j=await r.text();
        let js;
        try{ js=JSON.parse(j); }catch{ continue; }
        // Case 1: MCP endpoint returns tools
        if(js && (js.tools || js.named_endpoints)){
          hasApi='Yes';
          if(js.named_endpoints) mcpTools=Object.keys(js.named_endpoints).join(', ');
          if(js.tools) mcpTools=js.tools.map(t=>t.name||t).join(', ');
          mcpUrl=u;
          mcpJson=js;
          log(`Found Use via API: ${mcpTools}`);
          break;
        }
      }catch(e){ log(`No API at ${u}`); }
      await new Promise(r=>setTimeout(r,600));
    }

    // Special check for your example: kulkas2pintu/wan777 has 2 MCP Tools
    // If no API found, still save as you said
    if(hasApi==='No') log(`This link has no Use via API - saving too as you asked`);

    const row={name, spaceUrl, type:cat, hasApi, mcpTools: mcpTools|| (hasApi==='No'?'0':''), mcpUrl: mcpUrl|| (hasApi==='Yes'?tryUrls[0]:''), id:sp.id, likes:sp.likes||0};
    data.push(row);
    const tr=document.createElement('tr'); tr.className='border-b border-white/5';
    tr.innerHTML=`<td class="p-2 opacity-60">${i+1}</td><td class="p-2 font-bold">${row.name}</td><td class="p-2"><a href="${row.spaceUrl}" target="_blank" class="text-[#a78bfa] underline text-xs">${row.id}</a></td><td class="p-2 text-xs">${row.type}</td><td class="p-2 ${row.hasApi==='Yes'?'text-green-400':''}">${row.hasApi}</td><td class="p-2 text- max-w- truncate">${row.mcpTools}</td><td class="p-2 text- truncate max-w-">${row.mcpUrl}</td>`;
    document.getElementById('tbody').appendChild(tr);

    log(`Saved. Go back to list: ${listUrl} -> next model`);
    await new Promise(r=>setTimeout(r,800)); // anti-block delay
  }
  log(`\nFinished all ${data.length} models from ${cat}`);
}

function stop(){ stopFlag=true; log('Stopped'); }
function download(){
  const h=["name","space_url","type","has_api","mcp_tools","mcp_url","likes","space_id"];
  const csv=[h.join(',')].concat(data.map(d=>[d.name,d.spaceUrl,d.type,d.hasApi,d.mcpTools,d.mcpUrl,d.likes,d.id].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${document.getElementById('listUrl').value.includes('video-generation')?'video-generation':''}_wan_${Date.now()}.csv`; a.click();
}
</script>
</body>
</html>
