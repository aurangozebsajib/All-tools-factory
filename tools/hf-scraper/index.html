<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>HF Bulk Scraper</title><script src='https://cdn.tailwindcss.com'></script><style>body{background:#0e1116;color:#e5e7eb}</style></head><body class='p-6 max-w-7xl mx-auto'>
<a href='../../' class='text-sm text-white/60'>← Back</a>
<h1 class='mt-4 text-3xl font-bold'>🤗 HF Bulk Scraper v4</h1>
<div class='mt-6 grid md:grid-cols-4 gap-4'>
<div class='md:col-span-1 space-y-3'>
<select id='category' class='w-full bg-[#161a23] border border-white/10 rounded-lg px-3 py-2 text-sm'><option value='text-to-video'>Video Generation</option><option value='image-to-video'>Image-to-Video</option><option value='image-generation' selected>Image Generation</option><option value='text-generation'>Text Generation</option></select>
<select id='limit' class='w-full bg-[#161a23] border border-white/10 rounded-lg px-3 py-2 text-sm'><option>20</option><option selected>100</option><option>300</option></select>
<input id='proxy' placeholder='Cloudflare Worker URL optional' class='w-full bg-[#161a23] border border-white/10 rounded-lg px-3 py-2 text-sm'>
<button id='startBtn' class='w-full bg-white text-black py-2.5 rounded-xl font-semibold text-sm'>Start Scraping</button>
<div id='progress' class='text-xs text-white/60'></div>
</div>
<div class='md:col-span-3'><div class='flex gap-2 mb-3'><button onclick='downloadCSV("all")' class='text-xs bg-white/10 px-3 py-1 rounded'>ALL CSV</button><button onclick='downloadCSV("has_api")' class='text-xs bg-emerald-500/20 px-3 py-1 rounded'>Has API</button><button onclick='downloadCSV("no_api")' class='text-xs bg-amber-500/20 px-3 py-1 rounded'>No API</button><button onclick='downloadCSV("blank")' class='text-xs bg-red-500/20 px-3 py-1 rounded'>Blank</button></div>
<div class='overflow-auto border border-white/10 rounded-xl max-h-[70vh]'><table class='w-full text-xs'><thead class='sticky top-0 bg-[#161a23]'><tr><th class='p-2 text-left'>#</th><th class='p-2 text-left'>Name</th><th class='p-2'>Likes</th><th class='p-2'>API</th><th class='p-2'>Bucket</th><th class='p-2'>Link</th></tr></thead><tbody id='tbody'></tbody></table></div><div id='log' class='text-[11px] text-white/30 font-mono mt-2'></div></div></div>
<script>
let allRows=[]; let stopFlag=false;
async function hfSearch(q, limit){
  const url=`https://huggingface.co/api/spaces?search=${encodeURIComponent(q)}&limit=${limit}&sort=likes&direction=-1`;
  const r=await fetch(url); return await r.json();
}
async function fetchAPIInfo(spaceId, proxy){
  const host=spaceId.replaceAll('/','-').toLowerCase();
  const urls=[`https://${host}.hf.space/gradio_api/info?mcp=true`,`https://${host}.hf.space/gradio_api/info`];
  for(let t of urls){try{let u=proxy?`${proxy.replace(/\/$/,'')}/?url=${encodeURIComponent(t)}`:t; const r=await fetch(u); if(!r.ok) continue; return await r.json();}catch(e){}}
  return null;
}
document.getElementById('startBtn').onclick=async()=>{
  allRows=[]; document.getElementById('tbody').innerHTML=''; let cat=document.getElementById('category').value; let limit=document.getElementById('limit').value; let proxy=document.getElementById('proxy').value;
  document.getElementById('progress').textContent='Searching...';
  const spaces=await hfSearch(cat, limit);
  document.getElementById('progress').textContent=`Found ${spaces.length}, fetching Use via API...`;
  let i=0; for(let sp of spaces){i++; const id=sp.id; const api=await fetchAPIInfo(id, proxy); let bucket='blank', count=0; if(api){ const keys=Object.keys(api); const apiKeys=keys.filter(k=>k.startsWith('/')); count=api.named_endpoints?Object.keys(api.named_endpoints).length:apiKeys.length|| (api.endpoints?api.endpoints.length:0); bucket=count>0?'has_api':'no_api';} const row={tool_name:id, space_url:`https://huggingface.co/spaces/${id}`, likes:sp.likes||0, api_count:count, bucket}; allRows.push(row); const tr=document.createElement('tr'); tr.className='border-t border-white/5'; tr.innerHTML=`<td class='p-2'>${i}</td><td class='p-2'>${id}</td><td class='p-2'>${row.likes}</td><td class='p-2'>${count}</td><td class='p-2'>${bucket}</td><td class='p-2'><a href='${row.space_url}' target='_blank' class='text-violet-300'>open</a></td>`; document.getElementById('tbody').appendChild(tr); document.getElementById('progress').textContent=`${i}/${spaces.length} has_api:${allRows.filter(r=>r.bucket==='has_api').length} no_api:${allRows.filter(r=>r.bucket==='no_api').length} blank:${allRows.filter(r=>r.bucket==='blank').length}`; await new Promise(r=>setTimeout(r,250));}
};
function downloadCSV(b){let rows=b==='all'?allRows:allRows.filter(r=>r.bucket===b); if(!rows.length){alert('empty');return;} let csv=Object.keys(rows[0]).join(',')+'\n'+rows.map(r=>Object.values(r).map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`hf-${b}.csv`; a.click();}
</script></body></html>
